[package]
name = "syntax-highlight"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.0"
harfbuzz-wasm = { path="../harfbuzz-wasm" }
syntect = { version = "5.1.0", default-features = false, features = ["default-fancy"] }

[profile.release]
# Tell `rustc` to optimize for small code size
opt-level = "s"
lto = true
codegen-units = 1